name: Bambodia Native Invoice Foundation Acceptance

on:
  push:
    branches:
      - feature/mcp-phase4e2a-native-invoice-foundation-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      INVOICES_ENABLED: 'false'
      INVOICES_DRAFT_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, fileinfo, xml, curl, zip
          coverage: none
      - name: Locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Disposable app configuration
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Syntax and route/view compilation
        run: |
          set -Eeuo pipefail
          find app/Support/Invoices -name '*.php' -exec php -l {} \;
          php -l app/Models/MarketplaceInvoice.php
          php -l app/Models/MarketplaceInvoiceItem.php
          php -l app/Policies/MarketplaceInvoicePolicy.php
          php -l app/Http/Controllers/MarketplaceInvoiceController.php
          php -l database/migrations/2026_11_28_120000_create_marketplace_invoice_foundation.php
          php -l routes/web.php
          php artisan view:cache
          php artisan route:list --path=invoices
      - name: Additive invoice READ overlay fixture
        run: python3 -B support/bambodia-mcp-stage-invoice-read.py --self-test
      - name: Additive invoice WRITE overlay fixture
        run: python3 -B support/bambodia-mcp-stage-invoice-write.py --self-test
      - name: Invoice isolated tests
        run: php artisan test --filter='InvoiceMoneyTest|NativeInvoiceFoundationTest|McpInvoiceReadToolsTest|McpInvoiceWriteToolsTest'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build existing frontend assets for regression tests
        run: |
          npm install --ignore-scripts
          npm run build
          test -s public/build/manifest.json
      - name: Existing commerce and project regression tests
        run: php artisan test --filter='CommerceWorkspacesTest|CommercePaymentsTest|CreatorStudioAnalyticsTest|CustomerAccountOverviewTest|McpCommerceReadToolsTest|McpProjectReadToolsTest|McpProjectWriteToolsTest'
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: invoice-fixture-root-only
          MYSQL_DATABASE: bambodia_invoice_acceptance
          MYSQL_USER: invoice_acceptance
          MYSQL_PASSWORD: invoice-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bambodia_invoice_acceptance
      DB_USERNAME: invoice_acceptance
      DB_PASSWORD: invoice-fixture-only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      INVOICES_ENABLED: 'false'
      INVOICES_DRAFT_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, fileinfo, xml, curl, zip
          coverage: none
      - name: Locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Disposable MySQL identity gate
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = bambodia_invoice_acceptance
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=bambodia_invoice_acceptance",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); if($p->query("SELECT DATABASE()")->fetchColumn()!=="bambodia_invoice_acceptance")exit(1); echo "DISPOSABLE_MYSQL_IDENTITY=PASS\n";'
      - name: Invoice tests against disposable MySQL
        run: php artisan test --filter='InvoiceMoneyTest|NativeInvoiceFoundationTest|McpInvoiceReadToolsTest|McpInvoiceWriteToolsTest'

      - name: Independent MySQL concurrency and retry acceptance
        env:
          INVOICE_CONCURRENCY_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = bambodia_invoice_acceptance
          test -z "$DB_URL"
          php -l support/bambodia-mcp-phase4e3-concurrency.php
          php support/bambodia-mcp-phase4e3-concurrency.php

      - name: Actual MySQL deadlock and native manual review race
        env:
          INVOICE_CONCURRENCY_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          php -l support/bambodia-mcp-phase4e4-financial-concurrency.php
          php support/bambodia-mcp-phase4e4-financial-concurrency.php
