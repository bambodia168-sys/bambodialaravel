name: Bambodia Native Invoice Foundation Acceptance

on:
  push:
    branches:
      - feature/mcp-phase4e2a-native-invoice-foundation-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      INVOICES_ENABLED: 'false'
      INVOICES_DRAFT_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, fileinfo, xml, curl, zip
          coverage: none
      - name: Locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Disposable app configuration
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Syntax and route/view compilation
        run: |
          set -Eeuo pipefail
          find app/Support/Invoices -name '*.php' -exec php -l {} \;
          php -l app/Models/MarketplaceInvoice.php
          php -l app/Models/MarketplaceInvoiceItem.php
          php -l app/Policies/MarketplaceInvoicePolicy.php
          php -l app/Http/Controllers/MarketplaceInvoiceController.php
          php -l database/migrations/2026_11_28_120000_create_marketplace_invoice_foundation.php
          php -l routes/web.php
          php artisan view:cache
          php artisan route:list --path=invoices
      - name: Additive invoice READ overlay fixture
        run: python3 -B support/bambodia-mcp-stage-invoice-read.py --self-test
      - name: Additive invoice WRITE overlay fixture
        run: python3 -B support/bambodia-mcp-stage-invoice-write.py --self-test
      - name: Phase 4E.5 operator package syntax (not actual OAuth acceptance)
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin c1db97f9798cdd0e9291fb943d5a1a697c2b9f48 fd91345ed14fea36ed62f60d0cf43d3dc26024f2
          python3 -B support/operator/bambodia-phase4e6-prepare.py support/operator/bambodia-phase4e6-release.json --self-test .
          php -l support/operator/bambodia-phase4e6-schema-preflight.php
          python3 -B support/operator/verify-phase4e5-package.py
          bash -n support/operator/bambodia-phase4e5-isolated-oauth.sh
          awk '/^  cat >"\$run\/qa-isolated-db.sh" <<.DBSH./{p=1;next} /^DBSH$/{p=0;found=1} p{print} END{if(!found)exit 1}' support/operator/bambodia-phase4e5-isolated-oauth.sh | bash -n
          awk '/^  python3 - "\$@" <<.AUDITPY./{p=1;next} /^AUDITPY$/{p=0;found=1} p{print} END{if(!found)exit 1}' support/operator/bambodia-phase4e5-isolated-oauth.sh | python3 - --self-test app/Models/AuditEvent.php
          php -l support/operator/BambodiaPhase4E5IsolatedOAuthTest.php
          php -l support/operator/bambodia-phase4e5-fpm-probe.php
          echo PHASE4E5_OPERATOR_PACKAGE_SYNTAX=PASS
          bash -n support/operator/bambodia-phase4e6-combined-acceptance.sh
          awk '/^  cat > "\$run\/qa-route-snapshot.php" <<.ROUTEPHP./{p=1;next} /^ROUTEPHP$/{p=0;found=1} p{print} END{if(!found)exit 1}' support/operator/bambodia-phase4e6-combined-acceptance.sh | php -l
          echo PHASE4E6_COMBINED_PACKAGE_SYNTAX=PASS
      - name: Invoice isolated tests
        run: php artisan test --filter='InvoiceMoneyTest|NativeInvoiceFoundationTest|McpInvoiceReadToolsTest|McpInvoiceWriteToolsTest'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build existing frontend assets for regression tests
        run: |
          npm install --ignore-scripts
          npm run build
          test -s public/build/manifest.json
      - name: Existing commerce and project regression tests
        run: php artisan test --filter='CommerceWorkspacesTest|CommercePaymentsTest|CreatorStudioAnalyticsTest|CustomerAccountOverviewTest|McpCommerceReadToolsTest|McpProjectReadToolsTest|McpProjectWriteToolsTest'
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: invoice-fixture-root-only
          MYSQL_DATABASE: bambodia_invoice_acceptance
          MYSQL_USER: invoice_acceptance
          MYSQL_PASSWORD: invoice-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bambodia_invoice_acceptance
      DB_USERNAME: invoice_acceptance
      DB_PASSWORD: invoice-fixture-only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      INVOICES_ENABLED: 'false'
      INVOICES_DRAFT_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, fileinfo, xml, curl, zip
          coverage: none
      - name: Locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Disposable MySQL identity gate
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = bambodia_invoice_acceptance
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=bambodia_invoice_acceptance",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); if($p->query("SELECT DATABASE()")->fetchColumn()!=="bambodia_invoice_acceptance")exit(1); echo "DISPOSABLE_MYSQL_IDENTITY=PASS\n";'
      - name: Invoice tests against disposable MySQL
        run: php artisan test --filter='InvoiceMoneyTest|NativeInvoiceFoundationTest|McpInvoiceReadToolsTest|McpInvoiceWriteToolsTest'

      - name: Independent MySQL concurrency and retry acceptance
        env:
          INVOICE_CONCURRENCY_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = bambodia_invoice_acceptance
          test -z "$DB_URL"
          php -l support/bambodia-mcp-phase4e3-concurrency.php
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          php support/bambodia-mcp-phase4e3-concurrency.php | tee "$log"
          for marker in CONCURRENT_SAME_UUID_CREATE CONCURRENT_DISTINCT_UUID_CREATE CONCURRENT_UPDATE_DISCARD CONCURRENT_SOURCE_PAYMENT_TRANSITION SYNTHETIC_LATE_DEADLOCK_RETRY BOUNDED_RETRY_EXHAUSTION_ROLLBACK INDEPENDENT_MYSQL_CONCURRENCY; do
            test "$(grep -Fxc "$marker=PASS" "$log")" -eq 1
          done

      - name: Actual MySQL deadlock and native manual review race
        env:
          INVOICE_CONCURRENCY_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          php -l support/bambodia-mcp-phase4e4-financial-concurrency.php
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          php support/bambodia-mcp-phase4e4-financial-concurrency.php | tee "$log"
          for marker in MYSQL_ENGINE_DEADLOCK_SQLSTATE_40001_DRIVER_1213 MYSQL_ENGINE_DEADLOCK_RETRY_EXACTLY_ONCE NATIVE_MANUAL_APPROVAL_VS_CREATE NATIVE_MANUAL_APPROVAL_VS_UPDATE NATIVE_PAYMENT_TRANSITION_CONCURRENCY; do
            test "$(grep -Fxc "$marker=PASS" "$log")" -eq 1
          done
          test "$(grep -Fxc 'EXTERNAL_DELIVERY=NONE' "$log")" -eq 1
