name: Bambodia Quality
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, fileinfo, xml, curl, zip
          coverage: none
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
      - name: Validate installed-site upgrade shell syntax
        run: |
          bash -n support/workspace-upgrade.sh
          bash -n support/frontend-navigation-upgrade.sh
          bash -n support/typography-upgrade.sh
          bash -n support/header-upgrade.sh
          bash -n support/dashboard-upgrade.sh
          bash -n support/workflow-upgrade.sh
          bash -n support/operations-upgrade.sh
          bash -n support/frontend-layout-upgrade.sh
          bash -n support/builder-upgrade.sh
          bash -n support/builder-studio-upgrade.sh
          bash -n support/builder-studio-landing-upgrade.sh
          bash -n support/builder-studio-types-upgrade.sh
          bash -n support/builder-studio-workflow-upgrade.sh
          bash -n support/builder-ui-hardening-upgrade.sh
          bash -n support/product-license-upgrade.sh
          bash -n support/license-support-upgrade.sh
          bash -n support/license-actions-upgrade.sh
          bash -n support/license-issued-table-upgrade.sh
          bash -n support/license-definitions-upgrade.sh
          bash -n support/license-tables-upgrade.sh
          bash -n support/legal-policy-center-upgrade.sh
          bash -n support/policy-builder-upgrade.sh
          bash -n support/global-feedback-upgrade.sh
          bash -n support/policy-hero-upgrade.sh
          bash -n support/policy-reading-upgrade.sh
          bash -n support/policy-metadata-upgrade.sh
          bash -n support/knowledge-base-upgrade.sh
          bash -n support/knowledge-builder-layout-upgrade.sh
          bash -n support/support-knowledge-public-layout-upgrade.sh
          bash -n support/support-knowledge-article-enhancements-upgrade.sh
          bash -n support/support-knowledge-visual-polish-upgrade.sh
          bash -n support/support-center-content-hero-upgrade.sh
          bash -n support/support-agent-photo-upgrade.sh
          bash -n support/support-agent-clarity-upgrade.sh
          bash -n support/support-agent-blending-upgrade.sh
          bash -n support/support-agent-dark-hair-upgrade.sh
          bash -n support/support-agent-golden-halo-upgrade.sh
          bash -n support/support-agent-replacement-upgrade.sh
          bash -n support/support-knowledge-pagination-upgrade.sh
          bash -n support/policy-marketplace-coverage-upgrade.sh
          bash -n support/unified-row-actions-upgrade.sh
          bash -n support/post-builder-upgrade.sh
          bash -n support/frontend-layout-samples-upgrade.sh
          bash -n support/marketplace-card-grid-upgrade.sh
          bash -n support/category-slider-upgrade.sh
          bash -n support/freelancer-showcase-upgrade.sh
          bash -n support/job-list-upgrade.sh
          bash -n support/homepage-advantage-upgrade.sh
          bash -n support/homepage-section-order-upgrade.sh
          bash -n support/homepage-blog-slider-upgrade.sh
          bash -n support/homepage-ambient-hero-upgrade.sh
          bash -n support/detail-discussions-upgrade.sh
          bash -n support/detail-tabs-resources-upgrade.sh
          bash -n support/detail-offer-card-upgrade.sh
          bash -n support/detail-media-related-upgrade.sh
          bash -n support/compact-marketplace-cards-upgrade.sh
          bash -n support/creator-badge-manager-v2-upgrade.sh
          bash -n support/restore-badge-catalog-upgrade.sh
          bash -n support/creator-badge-gallery-upgrade.sh
          bash -n support/public-badge-display-upgrade.sh
          bash -n support/creator-sidebar-badges-upgrade.sh
          bash -n support/premium-creator-profile-aapanel-upgrade.sh
          bash -n support/premium-creator-profile-v4-aapanel-upgrade.sh
          bash -n support/premium-creator-profile-icons-upgrade.sh
          bash -n support/creator-badge-tooltip-viewport-upgrade.sh
          bash -n support/creator-profile-button-labels-upgrade.sh
          node --check public/js/creator-profile-v3.js
          node --check public/js/creator-badge-tooltip-viewport.js
          node --check public/js/ai-draft-studio.js
          node --check tests/browser/ai-draft-dialog-format.mjs
          node --check tests/browser/builder-terms-readable.mjs
          if grep -Eq '^[[:space:]]*inset:[[:space:]]*auto[[:space:]]*!important' public/css/creator-badge-tooltip-viewport.css; then echo 'Unsafe viewport tooltip inset override'; exit 1; fi
          node --check tests/browser/badge-tooltip-viewport.mjs
          php -l examples/license-validation.php
          php -l support/frontend-layout-samples.php
          bash -n support/builder-studio-db-backup.sh
          bash -n support/admin-controls-aapanel-upgrade.sh
          bash -n support/media-video-r2-aapanel-upgrade.sh
          bash -n support/media-video-controls-aapanel-upgrade.sh
          bash -n support/security-alerts-aapanel-upgrade.sh
          bash -n support/ai-draft-studio-aapanel-upgrade.sh
          bash -n support/ai-draft-activation-recovery-aapanel-upgrade.sh
          bash -n support/ai-draft-format-aapanel-upgrade.sh
          bash -n support/builder-terms-readable-aapanel-upgrade.sh
          bash -n support/marketplace-readiness-audit-aapanel-upgrade.sh
          bash -n support/preview-content-review-aapanel-upgrade.sh
          bash -n support/header-flag-scroll-top-aapanel-upgrade.sh
          bash -n support/bambodia-mcp-main-domain-readiness.sh
          bash -n support/bambodia-mcp-main-domain-install-target.sh
          bash -n support/bambodia-mcp-main-domain-isolated-lock.sh
          bash -n support/bambodia-mcp-main-domain-isolated-vendor.sh
          bash -n support/bambodia-mcp-main-domain-isolated-source-bundle.sh
          bash -n support/bambodia-mcp-main-domain-reuse-live-assets.sh
          bash -n support/bambodia-mcp-main-domain-live-drift-review.sh
          bash -n support/bambodia-mcp-main-domain-live-overlay.sh
          bash -n support/bambodia-mcp-main-domain-resolve-private-layout-review.sh
          bash -n support/bambodia-mcp-main-domain-resolve-private-critical.sh
          bash -n support/bambodia-mcp-main-domain-private-runtime-acceptance.sh
          bash -n support/bambodia-mcp-main-domain-physical-oauth-qa.sh
          bash -n support/bambodia-mcp-main-domain-private-developer-routes.sh
          bash -n support/bambodia-mcp-chatgpt-loopback-qa.sh
          bash -n support/bambodia-mcp-chatgpt-ci-loopback.sh
          python3 -m py_compile support/bambodia-mcp-chatgpt-loopback-client.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          client = Path("support/bambodia-mcp-chatgpt-loopback-client.py").read_text()
          ast.parse(client)
          assert 'class NoRedirect(HTTPRedirectHandler)' in client
          assert 'http://127.0.0.1:' in client
          assert 'CHATGPT_LOOPBACK_INDEPENDENT_HTTP_OAUTH_ACCEPTANCE=PASS' in client
          runner = Path("support/bambodia-mcp-chatgpt-loopback-qa.sh").read_text()
          assert len(runner.split("<<'PY'\n")) == 6
          for section in runner.split("<<'PY'\n")[1:]:
              ast.parse(section.split("\nPY\n", 1)[0])
          assert 'CLIENT_BLOB=' in runner
          assert '"BAMBODIA_MCP_ENABLED=true" "BAMBODIA_MCP_WRITES_ENABLED=true"' in runner
          assert '"DB_CONNECTION=sqlite" "DB_DATABASE=$HTTP_DB"' in runner
          assert '"127.0.0.1:$PORT"' in runner
          assert "EXTERNAL_CHATGPT_ACCOUNT_LINKING=NOT_ATTEMPTED" in runner
          assert 'http_php artisan route:clear --no-interaction --no-ansi' in runner
          assert 'http_php artisan route:list --json --no-ansi' in runner
          assert 'DISPOSABLE_QA_ROUTE_CACHE=REFRESHED' in runner
          assert 'CACHE_PATH="$QA/bootstrap/cache"' in runner
          assert 'CHATGPT_METADATA_DIAGNOSTIC=ROOT' in client
          assert "QA_HTTP_EXCEPTION_DIAGNOSTIC=FOUND" in runner
          assert "QA_HTTP_EXCEPTION_FINGERPRINT=" in runner
          assert "QA_HTTP_SQLITE_MISSING_TABLE=" in runner
          assert "APP_DEBUG stays false" in runner
          ci_runner = Path("support/bambodia-mcp-chatgpt-ci-loopback.sh").read_text()
          assert len(ci_runner.split("<<'PY'\n")) == 2
          ast.parse(ci_runner.split("<<'PY'\n")[1].split("\nPY\n", 1)[0])
          assert "GITHUB_ACTIONS" in ci_runner
          assert "storage/app/installed.lock" in ci_runner
          print("CHATGPT_INDEPENDENT_LOOPBACK_QA_STATIC_GUARDS=PASS")
          PY
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root = Path('support')
          script = (root / 'bambodia-mcp-main-domain-private-developer-routes.sh').read_text()
          parts = script.split("<<'PY'\n")
          assert len(parts) == 2
          ast.parse(parts[1].split("\nPY\n", 1)[0])
          assert "all_other_route_bytes_preserved" in script
          assert "PRIVATE_ROUTE_NON_DEVELOPER_BYTES=PRESERVED_EXACTLY" in script
          for name in ("developer.mcp.index", "developer.oauth.index", "developer.oauth.revoke"):
              assert name in script
              assert name in (root / 'bambodia-mcp-main-domain-private-runtime-acceptance.sh').read_text()
          assert "MCP_PRIVATE_DEVELOPER_ROUTE_SUPPLEMENT=VERIFIED" in (
              root / 'bambodia-mcp-main-domain-physical-oauth-qa.sh').read_text()
          assert "mcp-private-developer-routes.json" in script
          print("MCP_PRIVATE_OAUTH_DEVELOPER_ROUTE_GUARDS=PASS")
          PY
          python3 - <<'PY'
          import ast
          from pathlib import Path
          src = Path('support/bambodia-mcp-main-domain-physical-oauth-qa.sh').read_text()
          chunks = src.split("<<'PY'\n")
          assert len(chunks) == 2, "Expected one isolated Python verification"
          ast.parse(chunks[1].split("\nPY\n", 1)[0])
          print("MCP_PHYSICAL_OAUTH_QA_PYTHON_SYNTAX=PASS")
          for required in (
              'COMPOSER_ENTRY=/usr/bin/composer',
              'fail COMPOSER_ENTRY_IS_NOT_PHP',
              'COMPOSER_VERSION_OUTPUT="$(qa_php -d "include_path=/usr/share/php:."',
              '"$COMPOSER_ENTRY" --version --no-ansi 2>&1)',
              'COMPOSER_VERSION="$(printf',
              "COMPOSER_VERIFIED_VERSION=%s",
              "fail COMPOSER_VERSION_NOT_DETECTED",
              '"$COMPOSER_ENTRY" install',
              "COMPOSER_INTERPRETER=VERIFIED_PHP85_ENTRYPOINT",
              'qa_php "$QA/vendor/bin/phpunit" --colors=never --filter=BambodiaMcp',
              "QA_PHPUNIT_FROM_LOCKED_DEV_DEPENDENCIES=PASS",
              "QA_LOCK_CHANGED_DURING_DEV_INSTALL",
              "QA_MANIFEST_CHANGED_DURING_DEV_INSTALL",
          ):
              assert required in src, "Missing guarded disposable PHPUnit workflow: " + required
          assert "qa_php artisan test" not in src
          assert 'command -v composer' not in src, "A shell wrapper is unsafe for PHP"
          assert "execs /usr/bin/php83" in src, "Document the blocked PHP 8.3 wrapper"
          assert ' "$PHP" "$@"' in src, "The PHP CLI must be pinned"
          assert "grep -m1 -E" in src and "Composer( version)?" in src
          assert "error_reporting=8191" in src
          assert '--no-scripts --no-plugins' in src
          assert '"COMPOSER_HOME=$QA/.composer-home"' in src
          assert '"COMPOSER_CACHE_DIR=$QA/.composer-cache"' in src
          assert "--no-scripts --no-plugins" in src
          print("MCP_DISPOSABLE_DEV_TEST_RUNNER_GUARD=PASS")
          PY
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source = Path('support/bambodia-mcp-main-domain-private-runtime-acceptance.sh').read_text()
          sections = source.split("<<'PY'\n")[1:]
          assert len(sections) == 2, "Expected two embedded Python checks"
          for section in sections:
              ast.parse(section.split("\nPY\n", 1)[0])
          print("MCP_PRIVATE_RUNTIME_EMBEDDED_PYTHON=PASS")
          PY
          # The private-only MCP script contains Python in a Bash heredoc.
          # Validate both languages; never run the private server workflow in CI.
          sed -n "/^python3 - .*<<'PY'$/,/^PY$/p" support/bambodia-mcp-main-domain-resolve-private-critical.sh |
            sed '1d;$d' |
            python3 -c 'import ast, sys; src = sys.stdin.read(); assert len(src) > 5000; ast.parse(src); print("MCP_EMBEDDED_PYTHON_SYNTAX=PASS")'
      - name: Check guarded homepage installer syntax
        run: |
          python3 -m py_compile support/home-discovery-aapanel-upgrade.py
          python3 -m py_compile support/home-freelancer-avatar-aapanel-upgrade.py
          python3 -m py_compile support/remove-trailing-action-arrows-aapanel.py
          python3 -m py_compile support/blog-featured-video-aapanel.py
          python3 -m py_compile support/blog-premium-video-player-aapanel.py
          python3 -m py_compile support/reconcile-live-ui-aapanel-readonly.py
      - name: Check PHP syntax
        run: |
          find app bootstrap config database routes tests installer public support -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Compile production frontend
        run: npm run build
      - name: Retain isolated homepage Vite build for guarded aaPanel acceptance
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/home-discovery-responsive-grids-20261112' || github.event.pull_request.head.ref == 'fix/home-freelancer-avatar-link-20261112' || github.event.pull_request.head.ref == 'fix/blog-video-youtube-featured-20261113' || github.event.pull_request.head.ref == 'feat/blog-premium-native-video-player-20261113')
        uses: actions/upload-artifact@v4
        with:
          name: Bambodia-Home-Discovery-Vite
          path: public/build/
          if-no-files-found: error
          retention-days: 7
      - name: Lint compiled Blade templates
        run: |
          php artisan view:cache
          find storage/framework/views -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > /tmp/bambodia-blade-lint.txt
          echo "Compiled Blade PHP syntax: PASS"
          php artisan view:clear
      - name: Preinstall HTTP smoke test
        run: |
          php -S 127.0.0.1:8090 -t public public/index.php > /tmp/bambodia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS -o /tmp/bambodia-setup.html http://127.0.0.1:8090/installer
          grep -q 'Requirements' /tmp/bambodia-setup.html
          test -f storage/app/installer-access.txt
          test ! -f storage/app/installed.lock
      - name: Validate release preflight report format without claiming hosting approval
        run: |
          php support/hosting-preflight.php --webroot=public --json > /tmp/bambodia-preflight.json
          php -r '$r=json_decode(file_get_contents("/tmp/bambodia-preflight.json"),true,512,JSON_THROW_ON_ERROR); if (!isset($r["status"],$r["blockers"],$r["results"]) || !is_array($r["results"])) exit(1);'
      - name: Generate isolated Passport keys for OAuth feature tests
        env:
          APP_ENV: testing
        run: |
          test "${GITHUB_ACTIONS}" = true
          test ! -e storage/oauth-private.key
          test ! -e storage/oauth-public.key
          php artisan passport:keys --no-interaction --no-ansi
          test -s storage/oauth-private.key
          test -s storage/oauth-public.key
          chmod 600 storage/oauth-private.key storage/oauth-public.key
          echo "CI_ONLY_PASSPORT_KEYS=GENERATED"
      - name: Independent ChatGPT-style HTTP OAuth acceptance (localhost only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/bambodia-mcp-main-domain-20261112'
        env:
          APP_ENV: testing
        run: bash support/bambodia-mcp-chatgpt-ci-loopback.sh --ci-only
      - name: Verify revoked administrator cannot approve OAuth consent
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test --filter=test_demotion_between_oauth_consent_page_and_approval_is_denied
      - name: Test routes and workflows
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test
