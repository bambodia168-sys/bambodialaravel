          import ast
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          file=Path("support/bambodia-mcp-two-blade-candidate-http-qa-20261113.sh")
          script=file.read_text()
          parts=script.split("<<'PY'\n")
          assert len(parts)==3, "Require exactly two pinned Python validation/adapter blocks"
          for part in parts[1:]:
              ast.parse(part.split("\nPY\n",1)[0])

          for expected in (
              "NEW=/root/Bambodia-MCP-Overlay-TwoBlade.9ZqCTvhp",
              "PRIOR=/root/Bambodia-MCP-Overlay-Refresh.hZDR51NJ",
              "TWO_BLADE_CANDIDATE_PROVENANCE=PASS",
              "TWO_BLADE_NEWER_TEMPLATES=2_OF_2_VERIFIED",
              "TWO_BLADE_PRIOR_TEMPLATES=2_SNAPSHOT_PRESERVED",
