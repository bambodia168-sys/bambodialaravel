              "MCP_DB_METADATA_CLIENT_INTEGRITY=PASS",
              "env -i", "MCP_RELEASE_GATE=BLOCKED",
          ):
              assert required in operator, "missing operator security guard: "+required
          for required in (
              "information_schema.TABLES", "SELECT DATABASE()",
