          assert "LOCAL_OPERATOR_REVIEW_ONLY_NOT_APPROVED_NOT_EXECUTABLE" in local
          assert "MCP_PRIVATE_REMEDIATION=NOT_PERFORMED" in local
          assert "EXPECTED_EXACTLY_ONE_AFFECTED_FILE" in local
          assert "PRIVATE_ANCESTOR_UNSAFE" in local
          assert "O_NOFOLLOW" in local
          assert "restic_password_file" in backup
          assert "MCP_RECOVERY_BACKUP_CREATED" in backup
          assert "MCP_RECOVERY_ISOLATED_RESTORE" in backup
          isolated=Path("support/bambodia-mcp-isolated-restore-preflight-20261113.py").read_text()
          assert "MCP_RESTORE_ACCEPTANCE=BLOCKED_PENDING_INDEPENDENT_EVIDENCE" in isolated
          assert "MCP_RESTORE_ACTUAL_DATABASE_IDENTITY=NOT_VERIFIED" in isolated
          reconciliation=Path("support/bambodia-mcp-restored-manifest-reconcile-20261113.py").read_text()
          assert "MCP_RECONCILIATION_SOURCE_PROVENANCE=NOT_INDEPENDENTLY_VERIFIED" in reconciliation
          assert "MCP_RESTORE_ACCEPTANCE=BLOCKED_PENDING_INDEPENDENT_REVIEW" in reconciliation
          assert "MANIFEST_MISMATCH" in reconciliation
          assert "MCP_RESTORE_HOST_NETWORK_ISOLATION=NOT_VERIFIED" in isolated
          assert "TARGET_OUTSIDE_PRIVATE_RESTORE_AREA" in isolated
          assert "MCP_PRODUCTION_RELEASE" in backup
          for code in (local,impact,backup,isolated,reconciliation):
              for dangerous in ("subprocess.", "os.system(", "mysqldump --", "restic backup",
                                "os.chown(", "os.remove(", "os.rename(", "chmod -R"):
                  assert dangerous not in code, "preflight must not execute recovery or production mutations"
          print("MCP_RECOVERY_STAGED_PREFLIGHT_STATIC_SECURITY=PASS")
          PY
          python3 - <<'PY'
          import ast
          from pathlib import Path
          script=Path("support/bambodia-mcp-private-media-permissions-readonly-20261113.sh").read_text()
          marker="python3 - \"$APP\" <<'PY'\n"
          assert script.count(marker)==1, "expected exactly one Python permissions classifier"
          ast.parse(script.split(marker,1)[1].split("\nPY\n",1)[0])
          for required in (
              "MCP_PRIVATE_MODE_LIVE_IDENTITY=PASS",
              "MCP_PRIVATE_OTHER_READABLE_WITH_OTHER_TRAVERSAL",
