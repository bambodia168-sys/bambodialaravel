          python3 -m py_compile support/bambodia-mcp-readonly-go-live-20261114.py
          python3 -m py_compile support/bambodia-mcp-minimal-runtime-stage-20261114.py
          python3 -m py_compile support/bambodia-mcp-compatibility-review-readonly-20261114.py
          python3 -m py_compile support/bambodia-mcp-vendor-route-rehearsal-20261114.py
          python3 -m py_compile support/bambodia-mcp-live-runtime-install-20261114.py
          python3 -m py_compile support/bambodia-mcp-private-live-overlay-repro-20261114.py
          python3 -m py_compile support/bambodia-mcp-r2-recovery-execution-readiness-readonly-20261114.py
          python3 -m py_compile support/bambodia-mcp-isolated-restore-preflight-20261113.py
          python3 -m py_compile support/bambodia-mcp-restored-manifest-reconcile-20261113.py
          python3 -m unittest discover -s tests/security -p 'test_bambodia_mcp_recovery_preflight.py' -v
          python3 -m unittest discover -s tests/security -p 'test_bambodia_mcp_r2_approval.py' -v
          python3 -m unittest discover -s tests/security -p 'test_bambodia_mcp_r2_recovery_contract.py' -v
