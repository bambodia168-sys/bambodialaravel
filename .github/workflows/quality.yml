      - name: Check guarded homepage installer syntax
        run: |
          python3 -m py_compile support/home-discovery-aapanel-upgrade.py
          python3 -m py_compile support/home-freelancer-avatar-aapanel-upgrade.py
          python3 -m py_compile support/remove-trailing-action-arrows-aapanel.py
          python3 -m py_compile support/blog-featured-video-aapanel.py
          python3 -m py_compile support/blog-premium-video-player-aapanel.py
          python3 -m py_compile support/reconcile-live-ui-aapanel-readonly.py
      - name: Check PHP syntax
        run: |
          find app bootstrap config database routes tests installer public support -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Compile production frontend
        run: npm run build
      - name: Retain isolated homepage Vite build for guarded aaPanel acceptance
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/home-discovery-responsive-grids-20261112' || github.event.pull_request.head.ref == 'fix/home-freelancer-avatar-link-20261112' || github.event.pull_request.head.ref == 'fix/blog-video-youtube-featured-20261113' || github.event.pull_request.head.ref == 'feat/blog-premium-native-video-player-20261113')
        uses: actions/upload-artifact@v4
        with:
          name: Bambodia-Home-Discovery-Vite
          path: public/build/
          if-no-files-found: error
          retention-days: 7
      - name: Lint compiled Blade templates
        run: |
          php artisan view:cache
          find storage/framework/views -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > /tmp/bambodia-blade-lint.txt
          echo "Compiled Blade PHP syntax: PASS"
          php artisan view:clear
      - name: Preinstall HTTP smoke test
        run: |
          php -S 127.0.0.1:8090 -t public public/index.php > /tmp/bambodia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS -o /tmp/bambodia-setup.html http://127.0.0.1:8090/installer
          grep -q 'Requirements' /tmp/bambodia-setup.html
          test -f storage/app/installer-access.txt
          test ! -f storage/app/installed.lock
      - name: Validate release preflight report format without claiming hosting approval
        run: |
          php support/hosting-preflight.php --webroot=public --json > /tmp/bambodia-preflight.json
          php -r '$r=json_decode(file_get_contents("/tmp/bambodia-preflight.json"),true,512,JSON_THROW_ON_ERROR); if (!isset($r["status"],$r["blockers"],$r["results"]) || !is_array($r["results"])) exit(1);'
      - name: Generate isolated Passport keys for OAuth feature tests
        env:
          APP_ENV: testing
        run: |
          test "${GITHUB_ACTIONS}" = true
          test ! -e storage/oauth-private.key
          test ! -e storage/oauth-public.key
          php artisan passport:keys --no-interaction --no-ansi
          test -s storage/oauth-private.key
          test -s storage/oauth-public.key
          chmod 600 storage/oauth-private.key storage/oauth-public.key
          echo "CI_ONLY_PASSPORT_KEYS=GENERATED"
      - name: Independent ChatGPT-style HTTP OAuth acceptance (localhost only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/bambodia-mcp-main-domain-20261112'
        env:
          APP_ENV: testing
        run: bash support/bambodia-mcp-chatgpt-ci-loopback.sh --ci-only
      - name: Verify revoked administrator cannot approve OAuth consent
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test --filter=test_demotion_between_oauth_consent_page_and_approval_is_denied
      - name: Test routes and workflows
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test
